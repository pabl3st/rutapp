name: Release Sprint APK

on:
  push:
    tags:
      - 'sprint-s*'
      - 'v*'
  workflow_dispatch:
    inputs:
      sprint:
        description: 'Sprint tag (ej: sprint-s05)'
        required: true
        default: 'sprint-s05'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          add-job-summary: on-failure

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read version
        id: ver
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' | tr -d ' ')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed 's/[^0-9]*//g' | tr -d ' ')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.sprint }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=RutasApp-${VERSION_NAME}-${TAG}" >> $GITHUB_OUTPUT

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --build-cache --parallel
        continue-on-error: true

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk \
             artifacts/${{ steps.ver.outputs.apk_name }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk_name }}
          path: artifacts/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          name: RutasApp ${{ steps.ver.outputs.name }} — ${{ steps.ver.outputs.tag }}
          body: |
            ## RutasApp ${{ steps.ver.outputs.name }} (`${{ steps.ver.outputs.tag }}`)
            Build `${{ steps.ver.outputs.code }}` · Commit `${{ github.sha }}`

            **Instalación sobre versión anterior:** descarga el APK e instálalo directamente.
            Android actualizará la app existente sin desinstalar (mismo `applicationId`).

            > Ajustes → Seguridad → Instalar apps desconocidas → activar para tu gestor de archivos
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: success()
        run: |
          echo "### ✅ Release OK" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`${{ steps.ver.outputs.apk_name }}.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.ver.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
