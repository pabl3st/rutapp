name: Build Debug APK

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false
          add-job-summary: on-failure

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read version
        id: ver
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | grep -v 'Suffix' | sed 's/.*"\(.*\)".*/\1/' | tr -d ' ')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed 's/[^0-9]*//g' | tr -d ' ')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "apk_name=RutasApp-${VERSION_NAME}-build${VERSION_CODE}-${SHORT_SHA}-debug" >> $GITHUB_OUTPUT

      - name: Clean old artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Borrar todos los artifacts existentes para liberar quota antes de subir el nuevo
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[].id' 2>/dev/null || echo "")
          for id in $ARTIFACTS; do
            gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$id 2>/dev/null && echo "  Deleted $id" || true
          done
          echo "✅ Artifacts limpiados"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --build-cache --parallel

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk \
             artifacts/${{ steps.ver.outputs.apk_name }}.apk

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk_name }}
          path: artifacts/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        if: success()
        run: |
          echo "### ✅ Build OK" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`${{ steps.ver.outputs.apk_name }}.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ steps.ver.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
