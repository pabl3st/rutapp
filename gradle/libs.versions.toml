[versions]
compileSdk           = "35"
minSdk               = "26"
targetSdk            = "35"
agp                  = "8.5.2"
kotlin               = "2.0.21"
ksp                  = "2.0.21-1.0.25"
coreKtx              = "1.13.1"
lifecycleRuntime     = "2.8.6"
activityCompose      = "1.9.2"
composeBom           = "2024.10.00"
navigationCompose    = "2.8.3"
hilt                 = "2.52"
hiltNavCompose       = "1.2.0"
room                 = "2.6.1"
datastore            = "1.1.1"
retrofit             = "2.11.0"
okhttp               = "4.12.0"
moshi                = "1.15.1"
workManager          = "2.9.1"
mapsCompose          = "6.1.1"
playServicesLocation = "21.3.0"
playServicesMaps     = "19.0.0"
firebaseBom          = "33.5.1"
mlkitTextRecognition = "16.0.0"
cameraX              = "1.3.4"
vico                 = "2.0.0-beta.2"
coil                 = "2.7.0"
junit                = "4.13.2"
junitExt             = "1.2.1"
espresso             = "3.6.1"
mockk                = "1.13.12"
coroutinesTest       = "1.8.1"
biometric            = "1.2.0-alpha05"
securityCrypto       = "1.1.0-alpha06"

[libraries]
androidx-core-ktx                  = { group = "androidx.core",              name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel       = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-ktx",       version.ref = "lifecycleRuntime" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",    version.ref = "lifecycleRuntime" }
androidx-activity-compose          = { group = "androidx.activity",          name = "activity-compose",             version.ref = "activityCompose" }
compose-bom                        = { group = "androidx.compose",           name = "compose-bom",                  version.ref = "composeBom" }
compose-ui                         = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics                = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling-preview         = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-material3                  = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons             = { group = "androidx.compose.material",  name = "material-icons-extended" }
compose-ui-tooling                 = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-ui-test-manifest           = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
compose-ui-test-junit4             = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
navigation-compose                 = { group = "androidx.navigation",        name = "navigation-compose",           version.ref = "navigationCompose" }
hilt-android                       = { group = "com.google.dagger",          name = "hilt-android",                 version.ref = "hilt" }
hilt-android-compiler              = { group = "com.google.dagger",          name = "hilt-android-compiler",        version.ref = "hilt" }
hilt-navigation-compose            = { group = "androidx.hilt",              name = "hilt-navigation-compose",      version.ref = "hiltNavCompose" }
room-runtime                       = { group = "androidx.room",              name = "room-runtime",                 version.ref = "room" }
room-ktx                           = { group = "androidx.room",              name = "room-ktx",                     version.ref = "room" }
room-compiler                      = { group = "androidx.room",              name = "room-compiler",                version.ref = "room" }
datastore-preferences              = { group = "androidx.datastore",         name = "datastore-preferences",        version.ref = "datastore" }
retrofit                           = { group = "com.squareup.retrofit2",     name = "retrofit",                     version.ref = "retrofit" }
retrofit-moshi                     = { group = "com.squareup.retrofit2",     name = "converter-moshi",              version.ref = "retrofit" }
okhttp                             = { group = "com.squareup.okhttp3",       name = "okhttp",                       version.ref = "okhttp" }
okhttp-logging                     = { group = "com.squareup.okhttp3",       name = "logging-interceptor",          version.ref = "okhttp" }
moshi                              = { group = "com.squareup.moshi",         name = "moshi-kotlin",                 version.ref = "moshi" }
moshi-codegen                      = { group = "com.squareup.moshi",         name = "moshi-kotlin-codegen",         version.ref = "moshi" }
work-runtime-ktx                   = { group = "androidx.work",              name = "work-runtime-ktx",             version.ref = "workManager" }
hilt-work                          = { group = "androidx.hilt",              name = "hilt-work",                    version.ref = "hiltNavCompose" }
hilt-compiler-work                 = { group = "androidx.hilt",              name = "hilt-compiler",                version.ref = "hiltNavCompose" }
maps-compose                       = { group = "com.google.maps.android",    name = "maps-compose",                 version.ref = "mapsCompose" }
play-services-maps                 = { group = "com.google.android.gms",     name = "play-services-maps",           version.ref = "playServicesMaps" }
play-services-location             = { group = "com.google.android.gms",     name = "play-services-location",       version.ref = "playServicesLocation" }
firebase-bom                       = { group = "com.google.firebase",        name = "firebase-bom",                 version.ref = "firebaseBom" }
firebase-messaging                 = { group = "com.google.firebase",        name = "firebase-messaging-ktx" }
mlkit-text-recognition             = { group = "com.google.mlkit",           name = "text-recognition",             version.ref = "mlkitTextRecognition" }
camerax-core                       = { group = "androidx.camera",            name = "camera-core",                  version.ref = "cameraX" }
camerax-camera2                    = { group = "androidx.camera",            name = "camera-camera2",               version.ref = "cameraX" }
camerax-lifecycle                  = { group = "androidx.camera",            name = "camera-lifecycle",             version.ref = "cameraX" }
camerax-view                       = { group = "androidx.camera",            name = "camera-view",                  version.ref = "cameraX" }
vico-compose                       = { group = "com.patrykandpatrick.vico",  name = "compose-m3",                   version.ref = "vico" }
coil-compose                       = { group = "io.coil-kt",                 name = "coil-compose",                 version.ref = "coil" }
biometric                          = { group = "androidx.biometric",         name = "biometric",                    version.ref = "biometric" }
security-crypto                    = { group = "androidx.security",          name = "security-crypto",              version.ref = "securityCrypto" }
junit                              = { group = "junit",                      name = "junit",                        version.ref = "junit" }
junit-ext                          = { group = "androidx.test.ext",          name = "junit",                        version.ref = "junitExt" }
espresso-core                      = { group = "androidx.test.espresso",     name = "espresso-core",                version.ref = "espresso" }
mockk                              = { group = "io.mockk",                   name = "mockk",                        version.ref = "mockk" }
coroutines-test                    = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",      version.ref = "coroutinesTest" }
room-testing                       = { group = "androidx.room",              name = "room-testing",                 version.ref = "room" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
android-library     = { id = "com.android.library",                  version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",              version.ref = "ksp" }

[bundles]
compose        = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3", "compose-material-icons"]
lifecycle      = ["androidx-lifecycle-runtime-ktx", "androidx-lifecycle-viewmodel", "androidx-lifecycle-runtime-compose"]
camerax        = ["camerax-core", "camerax-camera2", "camerax-lifecycle", "camerax-view"]
network        = ["retrofit", "retrofit-moshi", "okhttp", "okhttp-logging", "moshi"]
room           = ["room-runtime", "room-ktx"]
testing-unit   = ["junit", "mockk", "coroutines-test"]
testing-android= ["junit-ext", "espresso-core", "compose-ui-test-junit4"]
